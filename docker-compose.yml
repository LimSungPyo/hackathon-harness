# 로컬 개발 환경: docker compose up --build
# DB가 필요하면: docker compose --profile db up --build
# 호스트 포트는 FRONTEND_PORT · BACKEND_PORT · DB_PORT 환경 변수로 바꿀 수 있다.
services:
  db:
    image: postgres:16-alpine
    profiles: ["db"]
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/app
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_PROXY: http://backend:8000
      # Docker 볼륨에서는 파일 변경 이벤트가 안 와서 폴링으로 감시한다
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db-data:
